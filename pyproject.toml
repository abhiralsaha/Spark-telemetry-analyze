[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-telemetry-analyzer"
version = "1.0.0"
description = "Analyze Apache Spark event-log telemetry: detect skew, spill, GC pressure, failures and waste, then report as text, JSON, Markdown, HTML or Prometheus metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spark Telemetry Analyzer contributors" }]
keywords = ["spark", "telemetry", "observability", "performance", "event-log", "data-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
# Zero runtime dependencies: the core tool runs on the standard library only.
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
lz4 = ["lz4>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sta = "spark_telemetry_analyzer.cli:main"
spark-telemetry-analyzer = "spark_telemetry_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark_telemetry_analyzer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
